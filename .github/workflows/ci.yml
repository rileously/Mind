name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'ruff<1' pyflakes

      - name: Syntax check
        run: python -m py_compile SwiftSlate.pyw

      - name: Pyflakes (undefined names, unused imports)
        run: pyflakes SwiftSlate.pyw

      - name: Ruff (real bugs only)
        # F = pyflakes rules (undefined names, unused vars)
        # E9 = syntax errors that prevent execution
        # B = flake8-bugbear (likely bugs, not style)
        # UP024/UP041/PLW1510 = fixable modernisation rules
        # Excluded: BLE001 (broad except is intentional in daemon threads under pythonw),
        #           RUF012 (ctypes _fields_ pattern, not a real mutable default),
        #           SIM115 (lock/log file handles must stay open),
        #           S310 (urllib HTTP client flagged as URL audit — false positive)
        run: ruff check --select F,E9,B,UP024,UP041,PLW1510 SwiftSlate.pyw

      - name: Verify installer hashes match files
        run: |
          for f in SwiftSlate.pyw commands.json; do
            actual=$(sha256sum "$f" | awk '{print toupper($1)}')
            pinned=$(grep -oP "\"$f\"\s*=\s*\"\K[0-9A-F]{64}" install.ps1 | head -1)
            if [ -z "$pinned" ] || [ "$actual" != "$pinned" ]; then
              echo "::error::$f hash mismatch: file is $actual, installer pins $pinned. Update the hash in install.ps1 in this commit (install the pre-commit hook with 'git config core.hooksPath .githooks' to keep pins in sync automatically)."
              exit 1
            fi
            echo "$f: hash OK"
          done

      - name: Verify Python runtime pin
        run: |
          ver=$(grep -oP '\$pythonVersion\s*=\s*"\K[0-9.]+' install.ps1 | head -1)
          pin=$(grep -oP '"python\.zip"\s*=\s*"\K[0-9A-F]{64}' install.ps1 | head -1)
          [ -n "$ver" ] || { echo "::error::install.ps1 is missing \$pythonVersion"; exit 1; }
          [ -n "$pin" ] || { echo "::error::install.ps1 is missing the python.zip pin"; exit 1; }
          [ ${#pin} -eq 64 ] || { echo "::error::python.zip pin must be 64 hex chars, got '$pin'"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip")
          [ "$code" = "200" ] || { echo "::error::embeddable zip for Python $ver is not available (HTTP $code)"; exit 1; }
          echo "python.zip pin OK ($ver)"

      - name: Verify no third-party imports
        # The engine runs under an embeddable Python that has no pip, so a
        # dependency it cannot install is a dependency it cannot have. "mind" is
        # first-party and shipped alongside, so it is allowed here - see the
        # note in the tests job about what that means for install.ps1.
        run: |
          python -c "import ast,sys,pathlib; t=ast.parse(pathlib.Path('SwiftSlate.pyw').read_text(encoding='utf-8')); m=set()
          for n in ast.walk(t):
              if isinstance(n,ast.Import): m|={a.name.split('.')[0] for a in n.names}
              elif isinstance(n,ast.ImportFrom) and n.level==0 and n.module: m.add(n.module.split('.')[0])
          bad=sorted(m-set(sys.stdlib_module_names)-{'mind'}); assert not bad, 'third-party imports: %s'%bad"
          echo "imports OK"

      - name: PowerShell syntax check
        # Every script Mind ships, not only the installer: the bundled ones do
        # the Windows API work, and a parse error in one is a feature that
        # fails on the user's machine and nowhere else.
        run: |
          pwsh -NoProfile -Command '
            $bad = 0
            foreach ($file in @(Get-ChildItem -Path . -Filter *.ps1 -Recurse -File)) {
              $errs = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errs) > $null
              if ($errs.Count) {
                Write-Host "::error::$($file.Name) does not parse"
                $errs | ForEach-Object { Write-Host $_.Message }
                $bad = 1
              } else {
                Write-Host "$($file.Name) parses OK"
              }
            }
            exit $bad'

  tests:
    # Windows, because this is a Windows program: mind\ imports winreg and
    # ctypes.wintypes, and the single-instance tests need a real window handle,
    # which is also why QT_QPA_PLATFORM is left alone rather than set to
    # offscreen - offscreen has no handle to post to.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -c "import py_compile, pathlib; [py_compile.compile(str(f), doraise=True) for f in pathlib.Path('mind').glob('*.py')]"

      - name: Regression tests
        run: python -m unittest discover -s tests -v
